<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>경성야록 · 자정의 라디오</title>
  <link rel="stylesheet" href="../case/fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body data-screen="room">
  <div class="room-bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <button class="to-room" id="toRoom" type="button">← 응접실로</button>
  <main class="stage">
    <section class="screen screen-room" aria-label="응접실">
      <button class="radio" id="radioBtn" type="button" aria-label="라디오 켜기">
        <span class="radio-glow" aria-hidden="true"></span>
        <img class="radio-img" src="./assets/radio.png" alt="낡은 목제 라디오 재현 그림" draggable="false">
      </button>
      <p class="hint hint-room">라디오를 눌러 사라진 방송을 찾으시오.</p>
      <a class="hint" href="../index.html">신문 지면으로 돌아가기</a>
    </section>
    <section class="screen screen-tune" aria-label="주파수 맞추기">
      <div class="dial-wrap">
        <span class="dial-mark" aria-hidden="true">▼</span>
        <div class="dial" id="dial" role="slider" tabindex="0" aria-label="주파수 다이얼" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0">
          <img class="dial-img" src="./assets/dial.png" alt="" draggable="false">
        </div>
      </div>
      <div class="readout">
        <p class="freq"><span id="freqNum">550</span> <small>킬로사이클</small></p>
        <div class="meter" aria-label="수신 신호"><span id="meterFill"></span></div>
      </div>
      <p class="hint hint-tune">다이얼을 돌려 수신 미터가 가득 차는 곳을 찾으시오.<br>드래그 · 손가락 · 휠 · 방향키로 조작할 수 있습니다.</p>
    </section>
    <section class="screen screen-air" aria-label="수신한 방송">
      <div class="scrap-shadow"><article class="scrap">
        <p class="scrap-kicker"><span>京城野錄 · 수신 기록</span><span class="scrap-freq"><span id="airFreq"></span> KC</span></p>
        <hr class="scrap-rule">
        <h1 class="scrap-title">잡음 사이로 돌아온 목소리</h1>
        <p class="scrap-cast">주파수를 찾았습니다.</p>
        <div class="player">
          <button class="play" id="playBtn" type="button" aria-label="재생">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
          <canvas class="wave" id="wave" aria-label="수신 파형"></canvas>
        </div>
        <p class="scrap-note" id="fileNote">현재는 방송 음원 없이 수신 파형을 보여주는 체험입니다.</p>
        <button class="retune" id="retune" type="button">다른 주파수 찾기</button>
      </article></div>
    </section>
  </main>
  <canvas class="noise" id="noise" aria-hidden="true"></canvas>
</body>
</html>
